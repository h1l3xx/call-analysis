global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ktor_backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: "backend"

  - job_name: "python_pipeline"
    metrics_path: /metrics
    static_configs:
      - targets: ["pipeline:8001"]
        labels:
          service: "pipeline"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "system"

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"

  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "docker"

  - job_name: "dcgm_exporter"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          service: "gpu"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
